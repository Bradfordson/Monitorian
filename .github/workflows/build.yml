name: Build Monitorian

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore and build (Release)
        run: msbuild Source\Monitorian\Monitorian.csproj -restore -t:Build -p:Configuration=Release -p:Platform=AnyCPU -v:minimal

      - name: Upload Monitorian build
        uses: actions/upload-artifact@v4
        with:
          name: Monitorian-Release
          path: |
            Source/Monitorian/bin/Release/
            !Source/Monitorian/bin/Release/**/*.pdb
            !Source/Monitorian/bin/Release/StartupAgency.xml
